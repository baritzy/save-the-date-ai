<!DOCTYPE html>
<html lang="he" dir="rtl" style="color-scheme: only light; background: #f2ede5;">
<!-- =========================================================
     TEMPORARY PAYMENT STUB
     Local stand-in for the hosted Grow payment page while the
     Grow account is pending. Mimics the flow only:
       success -> thank-you.html?order=<id>&paid=1&pkg=<pkg>
       cancel  -> index.html#order (order stays in localStorage)
     AT GROW INTEGRATION: delete this file and point PAYMENT_URLS
     in order-flow.js at the real Grow payment page URLs.
========================================================= -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <meta name="robots" content="noindex">
    <title>תשלום מאובטח | Save the Date AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Cpath d='M9 1l2.2 5.8L17 9l-5.8 2.2L9 17l-2.2-5.8L1 9l5.8-2.2L9 1z' fill='%23c9956a'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Heebo', sans-serif;
            background: #f2ede5;
            color: #2b2431;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .pay-card {
            background: #fff;
            border: 1px solid #e5dccf;
            border-radius: 14px;
            box-shadow: 0 18px 50px rgba(43, 36, 49, 0.10);
            max-width: 420px;
            width: 100%;
            padding: 36px 32px;
            text-align: center;
        }
        .stub-note {
            background: #fdf3e3;
            border: 1px dashed #c9956a;
            border-radius: 8px;
            color: #8a6a3f;
            font-size: 12.5px;
            padding: 8px 12px;
            margin-bottom: 22px;
        }
        .pay-brand {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .pay-brand span { color: #c9956a; }
        .pay-secure {
            color: #7a7284;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 26px;
        }
        .pay-summary {
            background: #fbf8f3;
            border: 1px solid #eee4d6;
            border-radius: 10px;
            padding: 18px 16px;
            margin-bottom: 26px;
        }
        .pay-row {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            padding: 5px 0;
        }
        .pay-row .lbl { color: #7a7284; }
        .pay-row .val { font-weight: 500; }
        .pay-total {
            border-top: 1px solid #eee4d6;
            margin-top: 8px;
            padding-top: 12px;
            font-size: 17px;
            font-weight: 700;
        }
        .pay-total .val { color: #9b5e6a; }
        .pay-btn {
            display: block;
            width: 100%;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-family: 'Heebo', sans-serif;
            font-size: 16px;
            font-weight: 500;
            padding: 14px 20px;
        }
        .pay-btn-success {
            background: #9b5e6a;
            color: #fff;
            margin-bottom: 12px;
        }
        .pay-btn-success:hover { background: #874f5b; }
        .pay-btn-cancel {
            background: transparent;
            border: 1px solid #d8cfc2;
            color: #7a7284;
        }
        .pay-btn-cancel:hover { border-color: #9b5e6a; color: #9b5e6a; }
    </style>
</head>
<body>

    <div class="pay-card">
        <div class="stub-note">עמוד תשלום זמני לבדיקות. יוחלף בדף התשלום המאובטח של Grow.</div>
        <div class="pay-brand" >Save the Date <span>AI</span></div>
        <div class="pay-secure">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="4" y="10" width="16" height="11" rx="2"/>
                <path d="M8 10V7a4 4 0 018 0v3"/>
            </svg>
            <span>תשלום מאובטח</span>
        </div>

        <div class="pay-summary">
            <div class="pay-row">
                <span class="lbl">חבילה</span>
                <span class="val" id="pkgName"></span>
            </div>
            <div class="pay-row">
                <span class="lbl">מספר הזמנה</span>
                <span class="val" id="orderNum" dir="ltr"></span>
            </div>
            <div class="pay-row pay-total">
                <span class="lbl">לתשלום</span>
                <span class="val" id="pkgPrice"></span>
            </div>
        </div>

        <button type="button" class="pay-btn pay-btn-success" id="payBtn">תשלום הצליח</button>
        <button type="button" class="pay-btn pay-btn-cancel" id="cancelBtn">ביטול</button>
    </div>

    <script>
    (function () {
        var PACKAGES = {
            vip:     { name: 'VIP - סיפור מלא',  price: 870 },
            regular: { name: 'רגיל - רגע אחד',   price: 450 }
        };
        var params  = new URLSearchParams(window.location.search);
        var pkgKey  = PACKAGES[params.get('pkg')] ? params.get('pkg') : 'vip';
        var pkg     = PACKAGES[pkgKey];
        var orderId = (params.get('order') || '').trim();

        document.getElementById('pkgName').textContent  = pkg.name;
        document.getElementById('pkgPrice').textContent = '₪' + pkg.price;
        document.getElementById('orderNum').textContent = orderId || '-';

        document.getElementById('payBtn').addEventListener('click', function () {
            window.location.href = 'thank-you.html?order=' + encodeURIComponent(orderId) +
                '&paid=1&pkg=' + encodeURIComponent(pkgKey);
        });
        document.getElementById('cancelBtn').addEventListener('click', function () {
            // The order stays in localStorage; index.html shows the
            // "complete your payment" banner instead of an empty form.
            window.location.href = 'index.html#order';
        });
    })();
    </script>

</body>
</html>
